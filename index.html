<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Spotify for MAG 322</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        .btn {
            background-color: #1DB954;
            color: white;
            padding: 15px 30px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .active {
            border: 4px solid #ffffff;
        }
        #info {
            font-size: 20px;
            margin-top: 30px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <h1>Spotify MAG322 Player</h1>
    <div id="status">Натисніть OK / Enter для авторизації</div>
    <br><br>
    <button id="loginBtn" class="btn active">Увійти в Spotify</button>

    <div id="info"></div>

    <script>
        const CLIENT_ID = '07d97368f22f4046b1b405b2cb24f39b';
        const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0];
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

        // Обробка кнопок пульта MAG 322
        document.addEventListener('keydown', function(e) {
            switch(e.keyCode) {
                case 13: // Enter / OK
                    if (!token) login();
                    break;
                case 82: // Play/Pause на пульті
                case 32: // Space
                    togglePlay();
                    break;
                case 39: // Стрілка вправо (Next)
                    nextTrack();
                    break;
                case 37: // Стрілка вліво (Prev)
                    prevTrack();
                    break;
            }
        });

        function login() {
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
            window.location.href = authUrl;
        }

        function getAccessToken() {
            const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
                if (item) {
                    var parts = item.split('=');
                    initial[parts[0]] = decodeURIComponent(parts[1]);
                }
                return initial;
            }, {});
            return hash.access_token;
        }

        const token = getAccessToken();

        if (token) {
            document.getElementById('status').innerText = '✅ Успішно підключено!';
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('info').innerHTML = 'Керуйте відтворенням із пульта:<br><br><b>OK/Play</b> — Пауза/Відтворення<br><b>Стрілки Left/Right</b> — Перемикання треків';
        }

        function togglePlay() {
            fetch('https://api.spotify.com/v1/me/player/play', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
        }

        function nextTrack() {
            fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
        }

        function prevTrack() {
            fetch('https://api.spotify.com/v1/me/player/previous', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
        }
    </script>
</body>
</html>

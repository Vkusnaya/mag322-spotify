<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Spotify for MAG 322</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        .btn {
            background-color: #1DB954;
            color: white;
            padding: 15px 30px;
            font-size: 24px;
            border: 4px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
        }
        #info {
            font-size: 20px;
            margin-top: 30px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <h1>Spotify MAG322 Player</h1>
    <div id="status">Натисніть OK / Enter / Клик для авторизації</div>
    <br><br>
    <button id="loginBtn" class="btn" onclick="login()" autofocus>Увійти в Spotify</button>

    <div id="info"></div>

    <script>
        const CLIENT_ID = '07d97368f22f4046b1b405b2cb24f39b';
        const REDIRECT_URI = 'https://vkusnaya.github.io/mag322-spotify/';
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

        function login() {
            document.getElementById('status').innerText = 'Перенаправлення в Spotify...';
            // Використовуємо новий стандарт response_type=code
            const authUrl = 'https://accounts.spotify.com/authorize?client_id=' + CLIENT_ID + 
                            '&response_type=code' + 
                            '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + 
                            '&scope=' + encodeURIComponent(SCOPES);
            
            window.location.assign(authUrl);
        }

        // Обробка кнопок пульта та клавіатури
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 13 || e.keyCode === 275 || e.keyCode === 32) {
                const code = getAuthCode();
                if (!code) {
                    login();
                } else {
                    togglePlay();
                }
            } else if (e.keyCode === 39) { // Стрілка вправо
                nextTrack();
            } else if (e.keyCode === 37) { // Стрілка вліво
                prevTrack();
            }
        });

        function getAuthCode() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('code');
        }

        const authCode = getAuthCode();

        if (authCode) {
            document.getElementById('status').innerText = '✅ Авторизовано!';
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('info').innerHTML = 'Керуйте відтворенням із пульта:<br><br><b>OK / Play</b> — Пауза/Відтворення<br><b>Стрілки Left/Right</b> — Перемикання треків';
        }

        function togglePlay() {
            fetch('https://api.spotify.com/v1/me/player/play', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + authCode }
            });
        }

        function nextTrack() {
            fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authCode }
            });
        }

        function prevTrack() {
            fetch('https://api.spotify.com/v1/me/player/previous', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authCode }
            });
        }
    </script>
</body>
</html>
